name: Build and Release Resume

on:
  push:
    branches: [master, main]
    paths:
      - '*.tex'
      - '.github/workflows/**'
  pull_request:
    branches: [master, main]
  workflow_dispatch:  # Allow manual trigger

jobs:
  build_latex:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compile LaTeX document (resume.tex)
        uses: xu-cheng/latex-action@v3
        with:
          root_file: resume.tex
          latexmk_use_xelatex: false
          latexmk_shell_escape: true

      - name: Compile LaTeX document (resume_v2.tex)
        uses: xu-cheng/latex-action@v3
        with:
          root_file: resume_v2.tex
          latexmk_use_xelatex: false
          latexmk_shell_escape: true

      - name: Rename PDFs with author name
        run: |
          mv resume.pdf Waseem_Raza_Resume.pdf
          mv resume_v2.pdf Waseem_Raza_Resume_v2.pdf

      - name: Upload PDFs as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: resume-pdf
          path: |
            Waseem_Raza_Resume.pdf
            Waseem_Raza_Resume_v2.pdf
          retention-days: 30

      - name: Commit updated PDFs to repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add Waseem_Raza_Resume.pdf Waseem_Raza_Resume_v2.pdf
          git diff --staged --quiet || git commit -m "Auto-update resume PDFs [skip ci]"
          git push

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Create Release on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Waseem_Raza_Resume.pdf
            Waseem_Raza_Resume_v2.pdf
          name: Resume ${{ steps.date.outputs.date }}
          body: |
            Updated resume (Waseem Raza - QA Automation Engineer) generated from LaTeX source.

            Download the PDF below.
          draft: false
          prerelease: false
